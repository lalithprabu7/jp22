version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: contractwatch-db
    environment:
      MYSQL_DATABASE: contractwatch
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contractwatch-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/contractwatch?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contractwatch-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
