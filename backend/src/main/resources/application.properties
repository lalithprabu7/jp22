# ==========================================
# ContractWatch — Application Configuration
# ==========================================

spring.application.name=ContractWatch

# ─── DataSource ───────────────────────────────
# Currently using H2 Database (saved to ./data/contractwatch) for demo purposes.
# To connect to real MySQL, comment out the H2 lines and uncomment the MySQL lines below:

# --- H2 Database (Demo Mode) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/contractwatch;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# --- Real MySQL ---
# spring.datasource.url=jdbc:mysql://localhost:3306/contractwatch?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JWT Security ──────────────────────────────────────
jwt.secret=contractwatch_super_secret_key_needs_to_be_long_enough_for_hs256_algorithm_2024
jwt.expiration=86400000

# ─── H2 Console ───────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA / Hibernate ──────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Server ───────────────────────────────────
server.port=8080

# ─── Swagger / OpenAPI ────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ─── Logging ──────────────────────────────────
logging.level.com.contractwatch=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ─── Jackson ──────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
