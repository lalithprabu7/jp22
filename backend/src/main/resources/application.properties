# ==========================================
# ContractWatch — Application Configuration
# ==========================================

spring.application.name=ContractWatch

# ─── DataSource ───────────────────────────────
# Default: Zero-setup local persistent database with MySQL compatibility mode
# Switch to MySQL anytime by setting spring.profiles.active=mysql or passing DB env vars
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/contractwatch;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ─── H2 Console ───────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA / Hibernate ──────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Server ───────────────────────────────────
server.port=8080

# ─── Swagger / OpenAPI ────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ─── Logging ──────────────────────────────────
logging.level.com.contractwatch=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ─── Jackson ──────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
